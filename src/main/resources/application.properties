spring.application.name=webhook-mock-api
# Server Configuration
server.port=8081

# Reverse proxy: client IP and scheme come from headers, only when the proxy connects from a private or loopback address.
# The host and port headers are ignored because proxies often pass on what the client sent (Host itself is used).
server.forward-headers-strategy=native
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For
server.tomcat.remoteip.host-header=
server.tomcat.remoteip.port-header=
# Secure is added automatically on HTTPS requests
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Database Configuration
spring.datasource.url=jdbc:h2:file:./data/mockwebhook
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# spring.jpa.hibernate.ddl-auto=validate
# update: Automatically adds missing columns without deleting data.
# create, create-drop, update, validate, none
spring.jpa.hibernate.ddl-auto=update

# Flyway Configuration for Database Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Existing database baseline
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
spring.flyway.ignore-missing-migrations=false
spring.flyway.ignore-ignored-migrations=false
spring.flyway.ignore-pending-migrations=false
spring.flyway.ignore-future-migrations=true
spring.flyway.clean-on-validation-error=false

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Logging
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.com.mockwebhook=DEBUG
logging.file.name=logs/app.log

# Set maximum file size for request
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Add app domain configuration
app.domain=https://mock-api.quyit.id.vn

# Request log retention configuration (in days)
app.request-log-retention-days=30
