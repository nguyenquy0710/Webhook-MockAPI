<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

  <head th:replace="fragments/header :: head('User Management')">
    <title>User Management</title>
  </head>

  <body>
    <div th:replace="fragments/header :: header"></div>
    <div class="container">
      <div th:replace="fragments/navigation :: navigation"></div>

      <!-- Layout: users are identified by avatar + name + email in one cell; search and role/status filters on top;
           rarely used actions (role, status, delete) sit in a "..." menu and always ask for confirmation. -->
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <h2 class="mb-0">Users <span class="badge bg-secondary align-middle fs-6" id="userCount" th:text="${#lists.size(users)}">0</span></h2>
        <a th:href="@{/admin/users/create}" class="btn btn-primary">
          <i class="fas fa-user-plus me-1"></i> Create User
        </a>
      </div>

      <!-- Success Message -->
      <div class="alert alert-success alert-dismissible fade show" role="alert" th:if="${successMessage}">
        <span th:text="${successMessage}">Success message</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>

      <!-- Error Message -->
      <div class="alert alert-danger alert-dismissible fade show" role="alert" th:if="${errorMessage}">
        <span th:text="${errorMessage}">Error message</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>

      <!-- Legacy success message for backward compatibility -->
      <div class="alert alert-success alert-dismissible fade show" role="alert" th:if="${param.deleted}">
        User deleted successfully!
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>

      <div class="card shadow-sm border-0">
        <div class="card-body border-bottom">
          <div class="row g-2">
            <div class="col-md-6">
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="fas fa-search text-muted"></i></span>
                <input type="search" class="form-control" id="userSearch" placeholder="Search by username or email...">
              </div>
            </div>
            <div class="col-6 col-md-3">
              <select class="form-select" id="roleFilter" aria-label="Role">
                <option value="">All roles</option><option value="ADMIN">Admin</option><option value="USER">User</option>
              </select>
            </div>
            <div class="col-6 col-md-3">
              <select class="form-select" id="statusFilter" aria-label="Status">
                <option value="">All status</option><option value="enabled">Enabled</option><option value="disabled">Disabled</option>
              </select>
            </div>
          </div>
        </div>

        <div class="table-responsive" style="min-height: 22rem;" th:unless="${#lists.isEmpty(users)}">
          <table class="table table-hover align-middle mb-0" id="userTable">
            <thead>
              <tr>
                <th>User</th>
                <th>Role</th>
                <th>Status</th>
                <th>Created</th>
                <th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="u : ${users}"
                th:attr="data-role=${u.role},data-status=${u.enabled ? 'enabled' : 'disabled'},data-search=${#strings.toLowerCase(u.username + ' ' + u.email)}">
                <td>
                  <div class="d-flex align-items-center gap-3">
                    <div class="rounded-circle bg-primary-subtle text-primary fw-bold d-flex align-items-center justify-content-center flex-shrink-0"
                      style="width:2.25rem;height:2.25rem;" th:text="${#strings.toUpperCase(#strings.substring(u.username, 0, 1))}">U</div>
                    <div>
                      <div class="fw-semibold" th:text="${u.username}">user</div>
                      <div class="text-muted small" th:text="${u.email}">email</div>
                    </div>
                  </div>
                </td>
                <td>
                  <span class="badge" th:classappend="${u.role == 'ADMIN' ? 'bg-danger' : 'bg-secondary'}" th:text="${u.role}">USER</span>
                </td>
                <td>
                  <span class="badge" th:classappend="${u.enabled ? 'bg-success' : 'bg-warning'}"
                    th:text="${u.enabled ? 'Enabled' : 'Disabled'}">Enabled</span>
                </td>
                <td class="text-muted" th:text="${#temporals.format(u.createdAt, 'yyyy-MM-dd HH:mm')}">2023-01-01 00:00</td>
                <td class="text-nowrap text-end">
                  <a th:href="@{|/admin/users/${u.id}|}" class="btn btn-sm btn-outline-primary" data-bs-toggle="tooltip" title="View Details">
                    <i class="fas fa-eye"></i>
                  </a>
                  <a th:href="@{|/admin/user/@${u.username}/logs|}" class="btn btn-sm btn-outline-info" data-bs-toggle="tooltip"
                    title="View Request Logs" target="_blank" rel="noopener">
                    <i class="fas fa-history"></i>
                  </a>
                  <div class="btn-group">
                    <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown"
                      aria-expanded="false" aria-label="More actions"><i class="fas fa-ellipsis-h"></i></button>
                    <ul class="dropdown-menu dropdown-menu-end shadow border-0">
                      <li>
                        <button class="dropdown-item" type="button" data-confirm-action
                          th:attr="data-action=@{|/admin/users/${u.id}/toggle-role|},data-title=${u.role == 'ADMIN' ? 'Demote to User' : 'Promote to Admin'},data-confirm=${u.role == 'ADMIN' ? 'Demote' : 'Promote'}"
                          th:with="label=${u.role == 'ADMIN' ? 'Demote to User' : 'Promote to Admin'}">
                          <i class="fas me-2" th:classappend="${u.role == 'ADMIN' ? 'fa-user-minus' : 'fa-user-shield'}"></i><span th:text="${label}">Promote to Admin</span>
                        </button>
                      </li>
                      <li>
                        <button class="dropdown-item" type="button" data-confirm-action
                          th:attr="data-action=@{|/admin/users/${u.id}/toggle-status|},data-title=${u.enabled ? 'Disable User' : 'Enable User'},data-confirm=${u.enabled ? 'Disable' : 'Enable'}">
                          <i class="fas me-2" th:classappend="${u.enabled ? 'fa-user-slash' : 'fa-user-check'}"></i><span th:text="${u.enabled ? 'Disable User' : 'Enable User'}">Disable User</span>
                        </button>
                      </li>
                      <li><hr class="dropdown-divider"></li>
                      <li>
                        <button class="dropdown-item text-danger" type="button" data-confirm-action data-danger="true"
                          th:attr="data-action=@{|/admin/users/${u.id}/delete|},data-title='Delete user',data-confirm='Delete',data-body='This action cannot be undone.'">
                          <i class="fas fa-trash me-2"></i>Delete User
                        </button>
                      </li>
                    </ul>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="text-center text-muted py-5" id="userEmpty" th:hidden="${!#lists.isEmpty(users)}">
          <i class="fas fa-users fa-3x mb-3"></i>
          <p class="mb-0">No users found.</p>
        </div>
      </div>
    </div>

    <!-- Shared confirmation modal for role/status/delete actions -->
    <div class="modal fade" id="confirmModal" tabindex="-1" aria-labelledby="confirmTitle" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <form method="post" id="confirmForm">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}">
            <div class="modal-header">
              <h5 class="modal-title" id="confirmTitle">Confirm</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="confirmBody">Are you sure?</div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-primary" id="confirmOk">Confirm</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div th:replace="fragments/footer :: footer"></div>

    <script>
      (function () {
        var $ = function (id) { return document.getElementById(id); };
        // Client-side search and role/status filters over the rendered rows
        function filter() {
          var q = $('userSearch').value.trim().toLowerCase(), role = $('roleFilter').value, st = $('statusFilter').value, shown = 0;
          var table = $('userTable');
          if (!table) return;
          table.querySelectorAll('tbody tr').forEach(function (r) {
            var ok = (!q || r.getAttribute('data-search').indexOf(q) !== -1) && (!role || r.getAttribute('data-role') === role) && (!st || r.getAttribute('data-status') === st);
            r.hidden = !ok;
            if (ok) shown++;
          });
          $('userCount').textContent = shown;
          table.parentNode.hidden = shown === 0;
          $('userEmpty').hidden = shown !== 0;
        }
        ['userSearch', 'roleFilter', 'statusFilter'].forEach(function (id) { $(id).addEventListener('input', filter); });

        // Menu actions open the shared confirmation modal with the right form action and wording
        document.addEventListener('click', function (e) {
          var b = e.target.closest('[data-confirm-action]');
          if (!b) return;
          $('confirmForm').action = b.getAttribute('data-action');
          $('confirmTitle').textContent = b.getAttribute('data-title') + '?';
          $('confirmBody').textContent = b.getAttribute('data-body') || (b.getAttribute('data-title') + '?');
          var ok = $('confirmOk');
          ok.textContent = b.getAttribute('data-confirm');
          ok.className = 'btn ' + (b.getAttribute('data-danger') ? 'btn-danger' : 'btn-primary');
          bootstrap.Modal.getOrCreateInstance($('confirmModal')).show();
        });
      })();
    </script>
  </body>

</html>
