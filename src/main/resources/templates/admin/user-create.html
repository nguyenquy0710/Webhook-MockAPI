<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head('Create User')">
    <title>Create User</title>
</head>
<body>
<div th:replace="fragments/header :: header"></div>
<div class="container">
    <div th:replace="fragments/navigation :: navigation"></div>

    <!-- Layout: fields grouped into Account / Security / Permissions; the sticky summary keeps Create User and Cancel in view. -->
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-2">
            <li class="breadcrumb-item"><a th:href="@{/admin/users}" class="text-decoration-none">Users</a></li>
            <li class="breadcrumb-item active" aria-current="page">Create</li>
        </ol>
    </nav>
    <h2 class="mb-4">Create New User</h2>

    <!-- Error Message -->
    <div class="alert alert-danger alert-dismissible fade show" role="alert" th:if="${errorMessage}">
        <span th:text="${errorMessage}">Error message</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <form th:action="@{/admin/users/create}" th:object="${createUserRequest}" method="post" id="userForm">
        <div class="row g-4">
            <div class="col-lg-8">
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-header bg-white py-3"><h5 class="mb-0"><i class="fas fa-user me-2 text-primary"></i>Account</h5></div>
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="username" class="form-label">Username *</label>
                                <input type="text" class="form-control" id="username" th:field="*{username}" autocomplete="off" required>
                                <small class="text-muted">3-50 characters, letters, numbers, and underscores only</small>
                                <div class="text-danger" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                            </div>
                            <div class="col-md-6">
                                <label for="email" class="form-label">Email *</label>
                                <input type="email" class="form-control" id="email" th:field="*{email}" autocomplete="off" required>
                                <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-header bg-white py-3"><h5 class="mb-0"><i class="fas fa-lock me-2 text-success"></i>Security</h5></div>
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="password" class="form-label">Password *</label>
                                <div class="input-group">
                                    <input type="password" class="form-control" id="password" th:field="*{password}" autocomplete="new-password" required>
                                    <button class="btn btn-outline-secondary" type="button" data-toggle-password="password" aria-label="Show password"><i class="fas fa-eye"></i></button>
                                </div>
                                <small class="text-muted">At least 6 characters</small>
                                <div class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                            </div>
                            <div class="col-md-6">
                                <label for="confirmPassword" class="form-label">Confirm Password *</label>
                                <div class="input-group">
                                    <input type="password" class="form-control" id="confirmPassword" th:field="*{confirmPassword}" autocomplete="new-password" required>
                                    <button class="btn btn-outline-secondary" type="button" data-toggle-password="confirmPassword" aria-label="Show password"><i class="fas fa-eye"></i></button>
                                </div>
                                <div class="invalid-feedback">Passwords do not match</div>
                                <div class="text-danger" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-header bg-white py-3"><h5 class="mb-0"><i class="fas fa-user-shield me-2 text-info"></i>Permissions</h5></div>
                    <div class="card-body">
                        <div class="row g-3 align-items-end">
                            <div class="col-md-6">
                                <label for="role" class="form-label">Role *</label>
                                <select class="form-select" id="role" th:field="*{role}" required>
                                    <option value="USER">User</option>
                                    <option value="ADMIN">Admin</option>
                                </select>
                                <div class="text-danger" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-check form-switch mb-2">
                                    <input class="form-check-input" type="checkbox" id="enabled" th:field="*{enabled}">
                                    <label class="form-check-label" for="enabled">Account Enabled</label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="sticky-lg-top" style="top: 1rem;">
                    <div class="card shadow-sm border-0">
                        <div class="card-header bg-white py-3"><h5 class="mb-0">Summary</h5></div>
                        <div class="card-body">
                            <div class="d-flex align-items-center gap-3 mb-3">
                                <div class="rounded-circle bg-primary-subtle text-primary fw-bold d-flex align-items-center justify-content-center" style="width:2.75rem;height:2.75rem;" id="sAvatar">?</div>
                                <div><div class="fw-semibold" id="sName">New user</div><div class="text-muted small text-break" id="sEmail">-</div></div>
                            </div>
                            <div class="d-flex gap-2 mb-3"><span class="badge bg-secondary" id="sRole">USER</span><span class="badge bg-success" id="sStatus">Enabled</span></div>
                            <div class="text-muted small mb-3">* Required fields</div>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary"><i class="fas fa-user-plus me-1"></i> Create User</button>
                                <a th:href="@{/admin/users}" class="btn btn-outline-secondary"><i class="fas fa-arrow-left me-1"></i> Cancel</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
<div th:replace="fragments/footer :: footer"></div>

<script th:src="@{/js/password-toggle.js}"></script>
<script>
    (function () {
        var $ = function (id) { return document.getElementById(id); };
        // Password confirmation validation
        function check() {
            var ok = $('password').value === $('confirmPassword').value;
            $('confirmPassword').setCustomValidity(ok ? '' : 'Passwords do not match');
            $('confirmPassword').classList.toggle('is-invalid', !ok && !!$('confirmPassword').value);
        }
        // Keep the summary card in sync with the form
        function summary() {
            var u = $('username').value.trim();
            $('sAvatar').textContent = u ? u[0].toUpperCase() : '?';
            $('sName').textContent = u || 'New user';
            $('sEmail').textContent = $('email').value.trim() || '-';
            $('sRole').textContent = $('role').value;
            $('sRole').className = 'badge ' + ($('role').value === 'ADMIN' ? 'bg-danger' : 'bg-secondary');
            $('sStatus').textContent = $('enabled').checked ? 'Enabled' : 'Disabled';
            $('sStatus').className = 'badge ' + ($('enabled').checked ? 'bg-success' : 'bg-warning');
        }
        $('userForm').addEventListener('input', function () { check(); summary(); });
        $('userForm').addEventListener('change', summary);
        summary();
    })();
</script>
</body>
</html>
