<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

    <head th:replace="fragments/header :: head('User Detail')">
        <title>User Detail</title>
    </head>

    <body>
        <div th:replace="fragments/header :: header"></div>
        <div class="container">
            <div th:replace="fragments/navigation :: navigation"></div>

<div class="row g-4">
<aside th:replace="fragments/admin-sidebar :: sidebar('users')"></aside>
<main class="col-lg-9" style="min-width:0">

            <!-- Layout: profile header (avatar, name, role, status) with the actions on the right, details as a label/value grid. -->
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-2">
                    <li class="breadcrumb-item"><a th:href="@{/admin/users}" class="text-decoration-none">Users</a></li>
                    <li class="breadcrumb-item active" aria-current="page">User Detail</li>
                </ol>
            </nav>

            <div class="card shadow-sm border-0 mb-4">
                <div class="card-body d-flex flex-wrap justify-content-between align-items-center gap-3">
                    <div class="d-flex align-items-center gap-3">
                        <div class="rounded-circle bg-primary-subtle text-primary fw-bold fs-4 d-flex align-items-center justify-content-center"
                            style="width:4rem;height:4rem;" th:text="${#strings.toUpperCase(#strings.substring(userDetail.username, 0, 1))}">U</div>
                        <div>
                            <h2 class="mb-1 fs-3" th:text="${userDetail.username}">user</h2>
                            <div class="d-flex flex-wrap gap-2 align-items-center">
                                <span class="badge" th:classappend="${userDetail.role == 'ADMIN' ? 'bg-danger' : 'bg-secondary'}" th:text="${userDetail.role}">USER</span>
                                <span class="badge" th:classappend="${userDetail.enabled ? 'bg-success' : 'bg-warning'}" th:text="${userDetail.enabled ? 'Enabled' : 'Disabled'}">Enabled</span>
                                <span class="text-muted small" th:text="${userDetail.email}">email</span>
                            </div>
                        </div>
                    </div>
                    <div class="d-flex flex-wrap gap-2">
                        <a th:href="@{|/admin/user/@${userDetail.username}/logs|}" class="btn btn-info">
                            <i class="fas fa-history me-1"></i> View Request Logs
                        </a>
                        <form th:action="@{|/admin/users/${userDetail.id}/toggle-role|}" method="post" class="d-inline">
                            <button class="btn btn-outline-info" type="submit" data-bs-toggle="tooltip"
                                th:title="${userDetail.role == 'ADMIN' ? 'Demote to User' : 'Promote to Admin'}"
                                onclick="return confirm(this.title + '?')">
                                <i class="fas" th:classappend="${userDetail.role == 'ADMIN' ? 'fa-user-minus' : 'fa-user-shield'}"></i>
                                <span th:text="${userDetail.role == 'ADMIN' ? 'Demote' : 'Promote'}"></span>
                            </button>
                        </form>
                        <form th:action="@{|/admin/users/${userDetail.id}/toggle-status|}" method="post" class="d-inline">
                            <button class="btn" th:classappend="${userDetail.enabled ? 'btn-outline-warning' : 'btn-outline-success'}"
                                type="submit" data-bs-toggle="tooltip" th:title="${userDetail.enabled ? 'Disable User' : 'Enable User'}"
                                onclick="return confirm(this.title + '?')">
                                <i class="fas" th:classappend="${userDetail.enabled ? 'fa-user-slash' : 'fa-user-check'}"></i>
                                <span th:text="${userDetail.enabled ? 'Disable' : 'Enable'}"></span>
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="row g-4">
                <div class="col-lg-8">
                    <div class="card shadow-sm border-0">
                        <div class="card-header bg-white py-3"><h5 class="mb-0">Details</h5></div>
                        <div class="card-body">
                            <dl class="row mb-0">
                                <dt class="col-sm-4 text-muted fw-normal">ID</dt><dd class="col-sm-8" th:text="${userDetail.id}">1</dd>
                                <dt class="col-sm-4 text-muted fw-normal">Username</dt><dd class="col-sm-8" th:text="${userDetail.username}">user</dd>
                                <dt class="col-sm-4 text-muted fw-normal">Email</dt><dd class="col-sm-8" th:text="${userDetail.email}">email</dd>
                                <dt class="col-sm-4 text-muted fw-normal">Role</dt>
                                <dd class="col-sm-8"><span class="badge" th:classappend="${userDetail.role == 'ADMIN' ? 'bg-danger' : 'bg-secondary'}" th:text="${userDetail.role}">USER</span></dd>
                                <dt class="col-sm-4 text-muted fw-normal">Status</dt>
                                <dd class="col-sm-8"><span class="badge" th:classappend="${userDetail.enabled ? 'bg-success' : 'bg-warning'}" th:text="${userDetail.enabled ? 'Enabled' : 'Disabled'}">Enabled</span></dd>
                                <dt class="col-sm-4 text-muted fw-normal">Created</dt>
                                <dd class="col-sm-8 mb-0" th:text="${#temporals.format(userDetail.createdAt, 'yyyy-MM-dd HH:mm:ss')}">2023-01-01 00:00:00</dd>
                            </dl>
                        </div>
                    </div>
                </div>
                <div class="col-lg-4">
                    <div class="card shadow-sm border-0">
                        <div class="card-body d-flex align-items-center gap-3">
                            <div class="rounded-3 bg-success-subtle text-success d-flex align-items-center justify-content-center" style="width:2.75rem;height:2.75rem;"><i class="fas fa-cogs"></i></div>
                            <div>
                                <div class="fs-4 fw-bold lh-1" th:text="${#lists.size(userDetail.apiConfigs)}">0</div>
                                <div class="text-muted small">API Configurations</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="mt-4">
                <a th:href="@{/admin/users}" class="btn btn-secondary"><i class="fas fa-arrow-left me-1"></i> Back to list</a>
            </div>
        </main>
</div>
</div>
        <div th:replace="fragments/footer :: footer"></div>
    </body>

</html>
