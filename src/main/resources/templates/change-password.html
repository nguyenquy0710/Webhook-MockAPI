<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head('Change Password')">
    <title>Change Password - Mock Webhook</title>
</head>
<body>
<div th:replace="fragments/header :: header"></div>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3 d-flex align-items-center justify-content-between">
                    <h4 class="mb-0"><i class="fas fa-key me-2 text-primary"></i>Change Password</h4>
                    <a th:href="@{/dashboard}" class="text-decoration-none small"><i class="fas fa-arrow-left me-1"></i>Back to Dashboard</a>
                </div>
                <div class="card-body p-4">
                    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="fas fa-exclamation-triangle me-2"></i>
                        <span th:text="${errorMessage}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                        <i class="fas fa-check-circle me-2"></i>
                        <span th:text="${successMessage}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <form th:action="@{/change-password}" th:object="${changePasswordRequest}" method="post" id="cpForm">
                        <div class="mb-3">
                            <label for="currentPassword" class="form-label">Current Password</label>
                            <div class="input-group">
                                <input type="password" class="form-control" id="currentPassword" th:field="*{currentPassword}" autocomplete="current-password" required>
                                <button class="btn btn-outline-secondary" type="button" data-toggle-password="currentPassword" aria-label="Show password"><i class="fas fa-eye"></i></button>
                            </div>
                            <div class="text-danger" th:if="${#fields.hasErrors('currentPassword')}"><small th:errors="*{currentPassword}"></small></div>
                        </div>
                        <div class="mb-3">
                            <label for="newPassword" class="form-label">New Password</label>
                            <div class="input-group">
                                <input type="password" class="form-control" id="newPassword" th:field="*{newPassword}" autocomplete="new-password" required>
                                <button class="btn btn-outline-secondary" type="button" data-toggle-password="newPassword" aria-label="Show password"><i class="fas fa-eye"></i></button>
                            </div>
                            <div class="progress mt-2" style="height:4px;" aria-hidden="true"><div class="progress-bar" id="strengthBar" style="width:0"></div></div>
                            <div class="text-danger" th:if="${#fields.hasErrors('newPassword')}"><small th:errors="*{newPassword}"></small></div>
                        </div>
                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">Confirm New Password</label>
                            <div class="input-group">
                                <input type="password" class="form-control" id="confirmPassword" th:field="*{confirmPassword}" autocomplete="new-password" required>
                                <button class="btn btn-outline-secondary" type="button" data-toggle-password="confirmPassword" aria-label="Show password"><i class="fas fa-eye"></i></button>
                            </div>
                            <div class="text-danger" th:if="${#fields.hasErrors('confirmPassword')}"><small th:errors="*{confirmPassword}"></small></div>
                        </div>
                        <ul class="list-unstyled small mb-4">
                            <li id="ruleLen" class="text-muted"><i class="far fa-circle me-2"></i>At least 6 characters</li>
                            <li id="ruleMatch" class="text-muted"><i class="far fa-circle me-2"></i>Passwords match</li>
                        </ul>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary" id="cpSubmit">
                                <i class="fas fa-save me-2"></i>Change Password
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="fragments/footer :: footer"></div>
<script th:src="@{/js/password-toggle.js}"></script>
<script>
    (function () {
        var $ = function (id) { return document.getElementById(id); };
        function strength(v) { var s = 0; if (v.length >= 6) s++; if (v.length >= 10) s++; if (/[a-z]/.test(v) && /[A-Z]/.test(v)) s++; if (/\d/.test(v)) s++; if (/[^A-Za-z0-9]/.test(v)) s++; return s; }
        function rule(id, ok) {
            var e = $(id);
            e.className = ok ? 'text-success' : 'text-muted';
            e.querySelector('i').className = ok ? 'fas fa-check-circle me-2' : 'far fa-circle me-2';
        }
        // Live checklist and strength bar for the new password
        function update() {
            var n = $('newPassword').value, c = $('confirmPassword').value, s = n ? Math.max(1, strength(n)) : 0, bar = $('strengthBar');
            bar.style.width = (s * 20) + '%';
            bar.className = 'progress-bar ' + (s <= 1 ? 'bg-danger' : (s <= 3 ? 'bg-warning' : 'bg-success'));
            rule('ruleLen', n.length >= 6);
            rule('ruleMatch', !!c && n === c);
        }
        $('newPassword').addEventListener('input', update);
        $('confirmPassword').addEventListener('input', update);
        $('cpForm').addEventListener('submit', function (e) {
            var n = $('newPassword').value, c = $('confirmPassword').value;
            if (n.length < 6 || n !== c) { e.preventDefault(); update(); }
        });
        update();
    })();
</script>
</body>
</html>
