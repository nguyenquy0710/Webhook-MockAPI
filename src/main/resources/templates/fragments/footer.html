<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

  <body>
    <footer th:fragment="footer" class="bg-light text-center text-lg-start mt-4 border-top">
      <div class="container p-4 mt-2" style="padding-top: 0px !important;">
        <div class="row">
          <div class="col-md-8" style="width: 100%">
            <h5 class="text-uppercase fw-bold text-primary">
              <i class="fas fa-webhook me-2"></i><span th:text="${siteName ?: 'Mock Webhook'}">Mock Webhook</span>
            </h5>
            <p class="text-muted mb-3">
              A simple application to create, manage, and test webhook APIs.
              Create custom endpoints, view incoming requests, and configure responses.
            </p>
            <p class="mt-3 mb-0">
              <strong>Part of <a href="https://docs.quyit.id.vn/mock-webhook" target="_blank"
                  class="text-primary text-decoration-none fw-bold">QuyIT Platform</a> tools suite</strong>
            </p>
          </div>
        </div>
      </div>

      <div class="text-center p-3 bg-white border-top">
        <small class="text-muted">
          © <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}">2025</span>
          <a href="https://quyit.id.vn" target="_blank" class="text-primary text-decoration-none mx-2">QuyIT Platform</a> |
          Mock Webhook Tool
        </small>
      </div>

      <!-- Bootstrap Bundle with Popper -->
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
      <!-- SockJS and STOMP for WebSocket -->
      <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js" integrity="sha384-svdnwiXBL+Js+yUneJSRFy24NgGiOfDM/vkQl/vCeVrcbYD6yW8EwPr1FnxTEZsR" crossorigin="anonymous"></script>
      <script src="https://cdn.jsdelivr.net/npm/stomp-websocket@2.3.4-next/lib/stomp.min.js" integrity="sha384-ulLBadSRDosj5urJdeMBAKHDAjZPQ/A6zwq35KTLodmy09P3SW3SUujHbv7UiQBj" crossorigin="anonymous"></script>
      <!-- jQuery -->
      <script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha384-vtXRMe3mGCbOeY7l30aIg8H9p3GdeSe4IFlP6G8JMa7o7lXvnz3GFKzPxzJdPfGK" crossorigin="anonymous"></script>
      <!-- DataTables JS for Bootstrap 5 -->
      <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js" integrity="sha384-k5vbMeKHbxEZ0AEBTSdR7UjAgWCcUfrS8c0c5b2AfIh7olfhNkyCZYwOfzOQhauK" crossorigin="anonymous"></script>
      <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js" integrity="sha384-PgPBH0hy6DTJwu7pTf6bkRqPlf/+pjUBExpr/eIfzszlGYFlF9Wi9VTAJODPhgCO" crossorigin="anonymous"></script>

      <script type="text/javascript">
        // Initialize tooltips
        var tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]');
        var tooltipList = [...tooltipTriggerList].map(el => new bootstrap.Tooltip(el));
        // Initialize popovers (endpoint notes)
        document.querySelectorAll('[data-bs-toggle="popover"]').forEach(el => new bootstrap.Popover(el));
      </script>
    </footer>
  </body>

</html>
