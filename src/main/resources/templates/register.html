<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head('Register')">
    <title>Register - Mock Webhook</title>
</head>
<body>
<div th:replace="fragments/header :: header"></div>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">
            <div class="card shadow border-0 rounded-4 mt-5">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="rounded-circle bg-primary-subtle text-primary d-inline-flex align-items-center justify-content-center mb-3" style="width:3.5rem;height:3.5rem;"><i class="fas fa-user-plus fa-lg"></i></div>
                        <h3 class="fw-light mb-1">Create Account</h3>
                        <p class="text-muted mb-0">Join the Mock Webhook platform</p>
                    </div>
                    <div class="alert alert-danger d-flex align-items-center py-2" th:if="${errorMessage}">
                        <i class="fas fa-exclamation-triangle me-2"></i>
                        <div th:text="${errorMessage}">Error message</div>
                    </div>
                    <form th:action="@{/register}" th:object="${registerRequest}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-user"></i></span>
                                <input class="form-control" id="username" type="text" th:field="*{username}" autocomplete="username" required />
                            </div>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                            <small class="form-text text-muted">Your webhook API URL will be: <code id="urlPreview" class="text-break">https://domain/api/@username</code></small>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email address</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                                <input class="form-control" id="email" type="email" th:field="*{email}" placeholder="name@example.com" autocomplete="email" required />
                            </div>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                <input class="form-control" id="password" type="password" th:field="*{password}" autocomplete="new-password" required />
                                <button class="btn btn-outline-secondary" type="button" data-toggle-password="password" aria-label="Show password"><i class="fas fa-eye"></i></button>
                            </div>
                            <div class="progress mt-2" style="height:4px;" aria-hidden="true"><div class="progress-bar" id="strengthBar" style="width:0"></div></div>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>
                        <div class="mb-4">
                            <label for="confirmPassword" class="form-label">Confirm Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                <input class="form-control" id="confirmPassword" type="password" th:field="*{confirmPassword}" autocomplete="new-password" required />
                                <button class="btn btn-outline-secondary" type="button" data-toggle-password="confirmPassword" aria-label="Show password"><i class="fas fa-eye"></i></button>
                            </div>
                            <div class="small mt-1" id="matchHint" hidden></div>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                        </div>
                        <div class="d-grid mb-3">
                            <button class="btn btn-primary btn-lg" type="submit">
                                <i class="fas fa-user-plus me-2"></i>Create Account
                            </button>
                        </div>
                        <div class="text-center">
                            <p class="mb-0">Already have an account?
                                <a th:href="@{/login}" class="text-decoration-none fw-bold">Sign In</a>
                            </p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="fragments/footer :: footer"></div>
<script th:src="@{/js/password-toggle.js}"></script>
<script th:inline="javascript">
    /*<![CDATA[*/
    (function () {
        var $ = function (id) { return document.getElementById(id); };
        var domain = /*[[${domain}]]*/ 'https://domain';
        function updateUrl() { $('urlPreview').textContent = domain + '/api/@' + ($('username').value.trim() || 'username'); }
        // Password strength: length, mixed case, digits and symbols
        function strength(v) { var s = 0; if (v.length >= 6) s++; if (v.length >= 10) s++; if (/[a-z]/.test(v) && /[A-Z]/.test(v)) s++; if (/\d/.test(v)) s++; if (/[^A-Za-z0-9]/.test(v)) s++; return s; }
        function check() {
            var p = $('password').value, c = $('confirmPassword').value, bar = $('strengthBar'), s = p ? Math.max(1, strength(p)) : 0;
            bar.style.width = (s * 20) + '%';
            bar.className = 'progress-bar ' + (s <= 1 ? 'bg-danger' : (s <= 3 ? 'bg-warning' : 'bg-success'));
            var hint = $('matchHint');
            hint.hidden = !c;
            hint.className = 'small mt-1 ' + (p === c ? 'text-success' : 'text-danger');
            hint.textContent = p === c ? 'Passwords match' : 'Passwords do not match';
        }
        $('username').addEventListener('input', updateUrl);
        $('password').addEventListener('input', check);
        $('confirmPassword').addEventListener('input', check);
        updateUrl(); check();
    })();
    /*]]>*/
</script>
</body>
</html>
