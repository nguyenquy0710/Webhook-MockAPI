<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head('Login')">
    <title>Login - Mock Webhook</title>
</head>
<body>
<div th:replace="fragments/header :: header"></div>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card shadow border-0 rounded-4 mt-5">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="rounded-circle bg-primary-subtle text-primary d-inline-flex align-items-center justify-content-center mb-3" style="width:3.5rem;height:3.5rem;"><i class="fas fa-lock fa-lg"></i></div>
                        <h3 class="fw-light mb-1">Welcome Back</h3>
                        <p class="text-muted mb-0">Sign in to your account</p>
                    </div>
                    <div class="alert alert-success d-flex align-items-center py-2" th:if="${param.registered}">
                        <i class="fas fa-check-circle me-2"></i>
                        <div>Registration successful! You can now login.</div>
                    </div>
                    <div class="alert alert-warning d-flex align-items-center py-2" th:if="${param.registrationClosed}">
                        <i class="fas fa-lock me-2"></i>
                        <div>New registrations are currently closed.</div>
                    </div>
                    <div class="alert alert-danger d-flex align-items-center py-2" th:if="${param.error}">
                        <i class="fas fa-exclamation-triangle me-2"></i>
                        <div>Invalid username or password.</div>
                    </div>
                    <div class="alert alert-info d-flex align-items-center py-2" th:if="${param.logout}">
                        <i class="fas fa-info-circle me-2"></i>
                        <div>You have been logged out successfully.</div>
                    </div>
                    <form th:action="@{/login}" method="post" id="loginForm">
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-user"></i></span>
                                <input class="form-control" id="username" name="username" type="text" autocomplete="username" autofocus required />
                            </div>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required />
                                <button class="btn btn-outline-secondary" type="button" data-toggle-password="password" aria-label="Show password"><i class="fas fa-eye"></i></button>
                            </div>
                        </div>
                        <div class="d-grid mb-3">
                            <button class="btn btn-primary btn-lg" type="submit" id="signIn">
                                <i class="fas fa-sign-in-alt me-2"></i>Sign In
                            </button>
                        </div>
                        <div class="text-center" th:if="${registrationEnabled}">
                            <p class="mb-0">Don't have an account?
                                <a th:href="@{/register}" class="text-decoration-none fw-bold">Create Account</a>
                            </p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="fragments/footer :: footer"></div>
<script th:src="@{/js/password-toggle.js}"></script>
<script>
    // Show a busy state while the sign-in request is in flight
    document.getElementById('loginForm').addEventListener('submit', function () {
        var btn = document.getElementById('signIn');
        if (!this.checkValidity()) return;
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Signing in…';
    });
</script>
</body>
</html>
