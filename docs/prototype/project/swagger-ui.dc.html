<script>
  var spec = {
    openapi: '3.0.1',
    info: { title: 'Mock API of @demo', version: '1.0.0' },
    servers: [{ url: 'https://mock.example.test/api/@demo' }],
    paths: {
      '/hello': { get: { summary: 'GET /hello', responses: { '200': { description: 'OK', content: { 'application/json': { example: { status_code: '200', message: 'Hello World!' } } } } } } },
      '/users/123': { get: { summary: 'GET /users/123', responses: { '200': { description: 'OK', content: { 'application/json': { example: { id: 123, name: 'Alice' } } } } } } },
      '/orders': { post: { summary: 'POST /orders', requestBody: { content: { 'application/json': { example: { amount: 25 } } } }, responses: { '201': { description: 'Created', content: { 'application/json': { example: { id: 42, status: 'created' } } } } } } },
      '/orders/42': {
        put: { summary: 'PUT /orders/42', responses: { '200': { description: 'OK' } } },
        delete: { summary: 'DELETE /orders/42', responses: { '204': { description: 'No Content' } } }
      },
      '/payments/callback': { post: { summary: 'POST /payments/callback', responses: { '500': { description: 'Internal Server Error' } } } }
    }
  };
  window.onload = function () {
    SwaggerUIBundle({ spec: spec, dom_id: '#swagger-ui', presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset], layout: 'StandaloneLayout' });
  };
</script>
