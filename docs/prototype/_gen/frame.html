<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} - Mock Webhook</title>
<!-- Theme: bootstrap (https://getbootstrap.com/) 5.3.3, giống UI gốc src/main/resources/templates/fragments/header.html -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet" crossorigin="anonymous">
<style>
  /* Từ static/css/styles.css và copy-wrapper.css của UI gốc */
  html { position: relative; min-height: 100%; }
  body { padding-bottom: 160px; margin-bottom: 0; min-height: 100vh; background-color: #f8f9fa; }
  footer { width: 100%; min-height: 160px; background-color: #f5f5f5; }
  pre { white-space: pre-wrap; word-wrap: break-word; overflow-wrap: break-word; overflow-y: auto; font-family: monospace;
        background: #f8f9fa; border: 1px solid #e9ecef; border-radius: .25rem; padding: .5rem; font-size: .875rem; }
  .copy-wrapper { position: relative; }
  .copy-wrapper .copy-btn { display: none; position: absolute; top: 5px; right: 5px; padding: 2px 8px; font-size: 12px; cursor: pointer;
        background: #007bff; border: none; color: #fff; border-radius: 3px; }
  .copy-wrapper:hover .copy-btn { display: block; }
  /* Dropdown mở khi rê chuột, như header gốc */
  .dropdown:hover .dropdown-menu { display: block; opacity: 1; visibility: visible; }
  .dropdown-menu { transition: opacity .15s ease-in-out, visibility .15s ease-in-out; }
</style>
</head>
<body>
{{header}}
<div class="container">
    {{nav}}
{{content}}
</div>

<footer class="bg-light text-center text-lg-start mt-4 border-top">
  <div class="container p-4 mt-2" style="padding-top: 0 !important;">
    <h5 class="text-uppercase fw-bold text-primary"><i class="fas fa-webhook me-2"></i>Mock Webhook</h5>
    <p class="text-muted mb-3">A simple application to create, manage, and test webhook APIs. Create custom endpoints, view incoming requests, and configure responses.</p>
    <p class="mt-3 mb-0"><strong>Part of <a href="#" class="text-primary text-decoration-none fw-bold">QuyIT Platform</a> tools suite</strong></p>
  </div>
  <div class="text-center p-3 bg-white border-top">
    <small class="text-muted">© 2026 <a href="#" class="text-primary text-decoration-none mx-2">QuyIT Platform</a> | Mock Webhook Tool</small>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script>
  // Tooltip như footer gốc; form không gửi đi đâu, hành vi do nút (actions.py) mô phỏng
  document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(function (el) { new bootstrap.Tooltip(el); });
  document.querySelectorAll('[data-bs-toggle="popover"]').forEach(function (el) { new bootstrap.Popover(el); });
  document.addEventListener('submit', function (e) { e.preventDefault(); });
  // Mở modal Bootstrap có sẵn sau khi hiện thông báo
  window.protoHideModal = function (id) { var m = bootstrap.Modal.getInstance(document.getElementById(id)); if (m) m.hide(); };
</script>
</body>
</html>
