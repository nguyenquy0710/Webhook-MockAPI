<!--title: Login-->
<!-- Nguồn: templates/login.html. Alert đăng ký/đăng xuất/lỗi (theo query param) chỉ hiện khi đăng nhập sai -->
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow border-0 rounded-4 mt-5">
      <div class="card-header bg-white border-0 text-center py-4">
        <h3 class="text-dark fw-light mb-0">Welcome Back</h3>
        <p class="text-muted mt-2 mb-0">Sign in to your account</p>
      </div>
      <div class="card-body px-4 pb-4">
        <div class="alert alert-danger d-flex align-items-center" id="loginError" hidden>
          <i class="fas fa-exclamation-triangle me-2"></i><div>Invalid username or password.</div>
        </div>
        <form>
          <div class="form-floating mb-3">
            <input class="form-control form-control-lg" id="username" name="username" type="text" placeholder="Username" required>
            <label for="username"><i class="fas fa-user me-2"></i>Username</label>
          </div>
          <div class="form-floating mb-4">
            <input class="form-control form-control-lg" id="password" name="password" type="password" placeholder="Password" required>
            <label for="password"><i class="fas fa-lock me-2"></i>Password</label>
          </div>
          <div class="d-grid mb-3">
            <button class="btn btn-primary btn-lg" type="submit" data-proto="skip" id="signIn"><i class="fas fa-sign-in-alt me-2"></i>Sign In</button>
          </div>
          <div class="text-center">
            <p class="mb-0">Don't have an account? <a href="register.dc.html" class="text-decoration-none fw-bold">Create Account</a></p>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
<script>
  // Mô phỏng đăng nhập: bỏ trống một ô thì báo lỗi như server gốc, đủ thông tin thì sang dashboard
  document.getElementById('signIn').addEventListener('click', function () {
    var u = document.getElementById('username').value.trim(), p = document.getElementById('password').value;
    document.getElementById('loginError').hidden = !!(u && p);
    if (u && p) location.href = 'dashboard.dc.html';
  });
</script>
