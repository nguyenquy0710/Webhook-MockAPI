<!--title: Create User-->
<!--layout: app-->
<!--active: admin-->
<!--
  Nguồn gốc: templates/admin/user-create.html (thiết kế lại). Ý đồ: chia nhóm Account / Security / Permissions, cột phải dính hiện tóm tắt
  tài khoản sắp tạo cùng nút Create User và Cancel; mật khẩu có hiện/ẩn và báo khớp ngay.
-->
<div class="row g-4">
<!-- Admin section menu on the left; stacks above the content on small screens -->
<aside class="col-lg-3"><div class="card shadow-sm border-0">
<div class="card-header bg-white py-3"><h6 class="mb-0 text-uppercase text-muted small fw-semibold"><i class="fas fa-users-cog me-2"></i>Administration</h6></div>
<div class="list-group list-group-flush"><a href="admin-users.dc.html" class="list-group-item list-group-item-action active" aria-current="page"><i class="fas fa-users me-2"></i> Users</a><a href="admin-settings.dc.html" class="list-group-item list-group-item-action"><i class="fas fa-sliders-h me-2"></i> Settings</a></div>
</div></aside>
<main class="col-lg-9" style="min-width:0">

<nav aria-label="breadcrumb">
  <ol class="breadcrumb mb-2">
    <li class="breadcrumb-item"><a href="admin-users.dc.html" class="text-decoration-none">Users</a></li>
    <li class="breadcrumb-item active" aria-current="page">Create</li>
  </ol>
</nav>
<h2 class="mb-4">Create New User</h2>

<form id="userForm" novalidate>
  <div class="row g-4">
    <div class="col-lg-8">
      <div class="card shadow-sm border-0 mb-4">
        <div class="card-header bg-white py-3"><h5 class="mb-0"><i class="fas fa-user me-2 text-primary"></i>Account</h5></div>
        <div class="card-body">
          <div class="row g-3">
            <div class="col-md-6">
              <label for="username" class="form-label">Username *</label>
              <input type="text" class="form-control" id="username" autocomplete="off" required>
              <small class="text-muted">3-50 characters, letters, numbers, and underscores only</small>
            </div>
            <div class="col-md-6">
              <label for="email" class="form-label">Email *</label>
              <input type="email" class="form-control" id="email" autocomplete="off" required>
            </div>
          </div>
        </div>
      </div>

      <div class="card shadow-sm border-0 mb-4">
        <div class="card-header bg-white py-3"><h5 class="mb-0"><i class="fas fa-lock me-2 text-success"></i>Security</h5></div>
        <div class="card-body">
          <div class="row g-3">
            <div class="col-md-6">
              <label for="password" class="form-label">Password *</label>
              <div class="input-group">
                <input type="password" class="form-control" id="password" required minlength="6" autocomplete="new-password">
                <button class="btn btn-outline-secondary" type="button" data-proto="skip" data-toggle-password="password" aria-label="Show password"><i class="fas fa-eye"></i></button>
              </div>
              <small class="text-muted">At least 6 characters</small>
            </div>
            <div class="col-md-6">
              <label for="confirmPassword" class="form-label">Confirm Password *</label>
              <div class="input-group">
                <input type="password" class="form-control" id="confirmPassword" required autocomplete="new-password">
                <button class="btn btn-outline-secondary" type="button" data-proto="skip" data-toggle-password="confirmPassword" aria-label="Show password"><i class="fas fa-eye"></i></button>
              </div>
              <div class="invalid-feedback">Passwords do not match</div>
            </div>
          </div>
        </div>
      </div>

      <div class="card shadow-sm border-0 mb-4">
        <div class="card-header bg-white py-3"><h5 class="mb-0"><i class="fas fa-user-shield me-2 text-info"></i>Permissions</h5></div>
        <div class="card-body">
          <div class="row g-3 align-items-end">
            <div class="col-md-6">
              <label for="role" class="form-label">Role *</label>
              <select class="form-select" id="role" required><option value="USER">User</option><option value="ADMIN">Admin</option></select>
            </div>
            <div class="col-md-6">
              <div class="form-check form-switch mb-2">
                <input class="form-check-input" type="checkbox" id="enabled" checked>
                <label class="form-check-label" for="enabled">Account Enabled</label>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="col-lg-4">
      <div class="sticky-lg-top" style="top: 1rem;">
        <div class="card shadow-sm border-0">
          <div class="card-header bg-white py-3"><h5 class="mb-0">Summary</h5></div>
          <div class="card-body">
            <div class="d-flex align-items-center gap-3 mb-3">
              <div class="rounded-circle bg-primary-subtle text-primary fw-bold d-flex align-items-center justify-content-center" style="width:2.75rem;height:2.75rem;" id="sAvatar">?</div>
              <div><div class="fw-semibold" id="sName">New user</div><div class="text-muted small text-break" id="sEmail">-</div></div>
            </div>
            <div class="d-flex gap-2 mb-3"><span class="badge bg-secondary" id="sRole">USER</span><span class="badge bg-success" id="sStatus">Enabled</span></div>
            <div class="text-muted small mb-3">* Required fields</div>
            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-primary" id="createUser" data-proto="skip"><i class="fas fa-user-plus me-1"></i> Create User</button>
              <a href="admin-users.dc.html" class="btn btn-outline-secondary"><i class="fas fa-arrow-left me-1"></i> Cancel</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</form>
</main>
</div>
<script>
  (function () {
    var $ = function (id) { return document.getElementById(id); };
    function check() { var ok = $('password').value === $('confirmPassword').value; $('confirmPassword').setCustomValidity(ok ? '' : 'Passwords do not match'); $('confirmPassword').classList.toggle('is-invalid', !ok && !!$('confirmPassword').value); }
    function summary() {
      var u = $('username').value.trim();
      $('sAvatar').textContent = u ? u[0].toUpperCase() : '?'; $('sName').textContent = u || 'New user'; $('sEmail').textContent = $('email').value.trim() || '-';
      $('sRole').textContent = $('role').value; $('sRole').className = 'badge ' + ($('role').value === 'ADMIN' ? 'bg-danger' : 'bg-secondary');
      $('sStatus').textContent = $('enabled').checked ? 'Enabled' : 'Disabled'; $('sStatus').className = 'badge ' + ($('enabled').checked ? 'bg-success' : 'bg-warning');
    }
    $('userForm').addEventListener('input', function () { check(); summary(); });
    $('userForm').addEventListener('change', summary);
    // Hợp lệ thì quay lại danh sách như redirect của server gốc
    $('createUser').addEventListener('click', function () {
      check(); $('userForm').classList.add('was-validated');
      if ($('userForm').checkValidity()) location.href = 'admin-users.dc.html';
    });
  })();
</script>
