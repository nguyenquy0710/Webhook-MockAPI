<!--title: Change Password-->
<!--layout: app-->
<!--
  Nguồn gốc: templates/change-password.html (thiết kế lại). Ý đồ: điều kiện mật khẩu mới hiện thành danh sách tick trực tiếp,
  nút hiện/ẩn mật khẩu, thông báo thành công ngay trên form; không còn phải bấm gửi mới biết sai.
-->
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-5">
    <div class="card shadow-sm border-0">
      <div class="card-header bg-white py-3 d-flex align-items-center justify-content-between">
        <h4 class="mb-0"><i class="fas fa-key me-2 text-primary"></i>Change Password</h4>
        <a href="dashboard.dc.html" class="text-decoration-none small"><i class="fas fa-arrow-left me-1"></i>Back to Dashboard</a>
      </div>
      <div class="card-body p-4">
        <div id="cpAlert"></div>
        <form id="cpForm" novalidate>
          <div class="mb-3">
            <label for="currentPassword" class="form-label">Current Password</label>
            <div class="input-group">
              <input type="password" class="form-control" id="currentPassword" autocomplete="current-password" required>
              <button class="btn btn-outline-secondary" type="button" data-proto="skip" data-toggle-password="currentPassword" aria-label="Show password"><i class="fas fa-eye"></i></button>
            </div>
            <div class="invalid-feedback d-block" id="curError" hidden>Please enter your current password.</div>
          </div>
          <div class="mb-3">
            <label for="newPassword" class="form-label">New Password</label>
            <div class="input-group">
              <input type="password" class="form-control" id="newPassword" autocomplete="new-password" required>
              <button class="btn btn-outline-secondary" type="button" data-proto="skip" data-toggle-password="newPassword" aria-label="Show password"><i class="fas fa-eye"></i></button>
            </div>
            <div class="progress mt-2" style="height:4px;" aria-hidden="true"><div class="progress-bar" id="strengthBar" style="width:0"></div></div>
          </div>
          <div class="mb-3">
            <label for="confirmPassword" class="form-label">Confirm New Password</label>
            <div class="input-group">
              <input type="password" class="form-control" id="confirmPassword" autocomplete="new-password" required>
              <button class="btn btn-outline-secondary" type="button" data-proto="skip" data-toggle-password="confirmPassword" aria-label="Show password"><i class="fas fa-eye"></i></button>
            </div>
          </div>
          <ul class="list-unstyled small mb-4">
            <li id="ruleLen" class="text-muted"><i class="far fa-circle me-2"></i>At least 6 characters</li>
            <li id="ruleMatch" class="text-muted"><i class="far fa-circle me-2"></i>Passwords match</li>
          </ul>
          <div class="d-grid">
            <button type="submit" class="btn btn-primary" data-proto="skip" id="cpSubmit"><i class="fas fa-save me-2"></i>Change Password</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
<script>
  (function () {
    var $ = function (id) { return document.getElementById(id); };
    function strength(v) { var s = 0; if (v.length >= 6) s++; if (v.length >= 10) s++; if (/[a-z]/.test(v) && /[A-Z]/.test(v)) s++; if (/\d/.test(v)) s++; if (/[^A-Za-z0-9]/.test(v)) s++; return s; }
    function rule(id, ok) { var e = $(id); e.className = ok ? 'text-success' : 'text-muted'; e.querySelector('i').className = ok ? 'fas fa-check-circle me-2' : 'far fa-circle me-2'; }
    function update() {
      var n = $('newPassword').value, c = $('confirmPassword').value, s = n ? Math.max(1, strength(n)) : 0, bar = $('strengthBar');
      bar.style.width = (s * 20) + '%'; bar.className = 'progress-bar ' + (s <= 1 ? 'bg-danger' : (s <= 3 ? 'bg-warning' : 'bg-success'));
      rule('ruleLen', n.length >= 6); rule('ruleMatch', !!c && n === c);
    }
    $('newPassword').addEventListener('input', update); $('confirmPassword').addEventListener('input', update);
    // Hợp lệ thì báo thành công sau độ trễ ngắn, như redirect của server gốc
    $('cpSubmit').addEventListener('click', function () {
      var n = $('newPassword').value, c = $('confirmPassword').value, cur = $('currentPassword').value;
      $('curError').hidden = !!cur;
      if (!cur || n.length < 6 || n !== c) { update(); return; }
      var btn = this; btn.disabled = true;
      setTimeout(function () {
        btn.disabled = false; $('cpForm').reset(); update();
        $('cpAlert').innerHTML = '<div class="alert alert-success alert-dismissible fade show" role="alert"><i class="fas fa-check-circle me-2"></i><span>Password changed successfully.</span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>';
      }, 600);
    });
  })();
</script>
