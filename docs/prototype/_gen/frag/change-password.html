<!--title: Change Password-->
<!--layout: app-->
<!-- Nguồn: templates/change-password.html (không có thanh điều hướng như bản gốc) -->
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm border-0">
      <div class="card-header bg-primary text-white"><h4 class="mb-0"><i class="fas fa-key me-2"></i>Change Password</h4></div>
      <div class="card-body">
        <form id="cpForm" novalidate>
          <div id="cpAlert"></div>
          <div class="mb-3">
            <label for="currentPassword" class="form-label">Current Password</label>
            <input type="password" class="form-control" id="currentPassword" required>
            <div class="invalid-feedback">Please enter your current password.</div>
          </div>
          <div class="mb-3">
            <label for="newPassword" class="form-label">New Password</label>
            <input type="password" class="form-control" id="newPassword" required minlength="6">
            <div class="invalid-feedback">Password must be at least 6 characters.</div>
          </div>
          <div class="mb-4">
            <label for="confirmPassword" class="form-label">Confirm New Password</label>
            <input type="password" class="form-control" id="confirmPassword" required>
            <div class="invalid-feedback">Passwords do not match.</div>
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-primary" data-proto="skip" id="cpSubmit"><i class="fas fa-save me-2"></i>Change Password</button>
          </div>
        </form>
      </div>
      <div class="card-footer text-muted text-center">
        <a href="dashboard.dc.html" class="text-decoration-none"><i class="fas fa-arrow-left me-2"></i>Back to Dashboard</a>
      </div>
    </div>
  </div>
</div>
<script>
  // Validate kiểu Bootstrap (was-validated) rồi báo thành công sau độ trễ ngắn, như redirect của server gốc
  document.getElementById('cpSubmit').addEventListener('click', function () {
    var f = document.getElementById('cpForm'), np = document.getElementById('newPassword'), cf = document.getElementById('confirmPassword');
    cf.setCustomValidity(np.value === cf.value ? '' : 'mismatch');
    f.classList.add('was-validated');
    var box = document.getElementById('cpAlert');
    if (!f.checkValidity()) { box.innerHTML = ''; return; }
    var btn = this; btn.disabled = true;
    setTimeout(function () {
      btn.disabled = false; f.reset(); f.classList.remove('was-validated');
      box.innerHTML = '<div class="alert alert-success alert-dismissible fade show" role="alert"><i class="fas fa-check-circle me-2"></i><span>Password changed successfully.</span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>';
    }, 600);
  });
</script>
