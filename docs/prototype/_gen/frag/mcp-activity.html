<!--
  Nguồn gốc: màn mới cho M8 trong plans/2026-10-29-mcp-server-planning.md. Ý đồ: người dùng thấy AI đã làm gì thay mình: tool nào, tham số,
  kết quả, client nào; tool ghi (tạo/sửa API) có nhãn riêng để lọc nhanh. Bấm hàng mở chi tiết request/response ở panel bên phải.
  Dữ liệu mẫu hư cấu; lọc, phân trang và chi tiết chạy phía client.
-->
<style>
  .row-link { cursor: pointer; }
  .args { max-width: 340px; }
  .detail-pre { max-height: 40vh; overflow-y: auto; background-color: #f8f9fa; border: 1px solid #dee2e6; border-radius: 5px; padding: 10px; font-size: .85rem; white-space: pre-wrap; word-break: break-word; margin-bottom: 0; }
</style>
<nav aria-label="breadcrumb">
  <ol class="breadcrumb mb-2">
    <li class="breadcrumb-item"><a href="dashboard.dc.html" class="text-decoration-none">Dashboard</a></li>
    <li class="breadcrumb-item active" aria-current="page">MCP Activity</li>
  </ol>
</nav>
<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
  <h2 class="mb-0">MCP Activity</h2>
  <a href="dashboard.dc.html" class="btn btn-outline-secondary"><i class="fas fa-arrow-left me-1"></i> Back to dashboard</a>
</div>

<div class="row g-3 mb-4">
  <div class="col-sm-4"><div class="card h-100 shadow-sm border-0"><div class="card-body d-flex align-items-center gap-3">
    <div class="rounded-3 bg-primary-subtle text-primary d-flex align-items-center justify-content-center" style="width:2.75rem;height:2.75rem;"><i class="fas fa-plug"></i></div>
    <div><div class="fs-4 fw-bold lh-1" id="statCalls">0</div><div class="text-muted small">Calls today</div></div></div></div></div>
  <div class="col-sm-4"><div class="card h-100 shadow-sm border-0"><div class="card-body d-flex align-items-center gap-3">
    <div class="rounded-3 bg-danger-subtle text-danger d-flex align-items-center justify-content-center" style="width:2.75rem;height:2.75rem;"><i class="fas fa-exclamation-triangle"></i></div>
    <div><div class="fs-4 fw-bold lh-1" id="statErrors">0</div><div class="text-muted small">Errors today</div></div></div></div></div>
  <div class="col-sm-4"><div class="card h-100 shadow-sm border-0"><div class="card-body d-flex align-items-center gap-3">
    <div class="rounded-3 bg-warning-subtle text-warning-emphasis d-flex align-items-center justify-content-center" style="width:2.75rem;height:2.75rem;"><i class="fas fa-pen"></i></div>
    <div><div class="fs-4 fw-bold lh-1" id="statWrites">0</div><div class="text-muted small">Changes made today</div></div></div></div></div>
</div>

<div class="card shadow-sm border-0">
  <div class="card-body border-bottom">
    <div class="row g-2">
      <div class="col-md-5">
        <div class="input-group"><span class="input-group-text bg-white"><i class="fas fa-search text-muted"></i></span>
          <input type="search" class="form-control" id="search" placeholder="Search arguments or client..."></div>
      </div>
      <div class="col-6 col-md-4">
        <select class="form-select" id="toolFilter" aria-label="Tool">
          <option value="">All tools</option><option>list_api_configs</option><option>get_api_config</option><option>create_api_config</option><option>update_api_config</option><option>get_request_log_stats</option><option>list_request_logs</option>
        </select>
      </div>
      <div class="col-6 col-md-3">
        <select class="form-select" id="resultFilter" aria-label="Result"><option value="">All results</option><option value="ok">OK</option><option value="error">Error</option></select>
      </div>
    </div>
  </div>
  <div class="table-responsive">
    <table class="table table-hover align-middle mb-0">
      <thead><tr><th>Time (UTC)</th><th>Tool</th><th>Arguments</th><th>Client</th><th class="text-end">Duration</th><th>Result</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div class="text-center text-muted py-5" id="empty" hidden><i class="fas fa-inbox fa-3x mb-3"></i><p class="mb-0">No MCP calls match your filters.</p></div>
  <div class="card-footer bg-white d-flex flex-wrap justify-content-between align-items-center gap-2">
    <div class="d-flex align-items-center gap-2 small text-muted">
      <span>Show</span>
      <select id="pageSize" class="form-select form-select-sm" style="width:auto;" aria-label="Page size"><option>10</option><option>25</option></select>
      <span id="range"></span>
    </div>
    <nav aria-label="Page navigation"><ul class="pagination pagination-sm mb-0" id="pageNav"></ul></nav>
  </div>
</div>

<div class="offcanvas offcanvas-end" tabindex="-1" id="detailsPanel" aria-labelledby="detailsLabel" style="width:min(640px,100vw);">
  <div class="offcanvas-header border-bottom">
    <h5 class="offcanvas-title" id="detailsLabel"><span class="badge me-2" id="dBadge"></span><span id="dTitle">tool</span></h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
  </div>
  <div class="offcanvas-body">
    <table class="table table-sm mb-3"><tbody>
      <tr><th style="width:9rem;">Time (UTC)</th><td id="dTime"></td></tr>
      <tr><th>Client</th><td id="dClient"></td></tr>
      <tr><th>Token</th><td id="dToken" class="font-monospace"></td></tr>
      <tr><th>Duration</th><td id="dDuration"></td></tr>
    </tbody></table>
    <h6>Request</h6><pre class="detail-pre mb-3" id="dReq"></pre>
    <h6>Response</h6><pre class="detail-pre" id="dRes"></pre>
  </div>
</div>

<script>
  (function () {
    var $ = function (id) { return document.getElementById(id); };
    var tools = [
      { name: 'list_api_configs', write: false, args: '{"page":0,"size":20}', res: '{"totalElements":14,"items":[…]}' },
      { name: 'get_api_config', write: false, args: '{"id":12}', res: '{"id":12,"method":"POST","path":"/orders"}' },
      { name: 'create_api_config', write: true, args: '{"method":"GET","path":"/health","statusCode":200}', res: '{"id":31,"path":"/health"}' },
      { name: 'update_api_config', write: true, args: '{"id":12,"statusCode":201,"expectedUpdatedAt":"2026-10-28T09:12:00Z"}', res: '{"id":12,"statusCode":201}' },
      { name: 'get_request_log_stats', write: false, args: '{"from":"2026-10-22","to":"2026-10-29"}', res: '{"total":1284,"byStatus":{"2xx":1190,"4xx":82,"5xx":12}}' },
      { name: 'list_request_logs', write: false, args: '{"path":"/orders","method":"POST","page":0,"size":20}', res: '{"totalElements":340,"items":[…]}' }
    ];
    var clients = ['claude-code 2.1', 'cursor 0.50', 'curl 8.5'];
    var errors = ['{"isError":true,"text":"Status code must be at most 599"}', '{"isError":true,"text":"API configuration not found"}', '{"isError":true,"text":"Changed since you read it; fetch it again"}'];
    var calls = [], now = new Date('2026-10-29T10:20:00Z').getTime();
    for (var i = 0; i < 37; i++) {
      var t = tools[(i * 5 + (i % 3)) % tools.length], bad = i % 7 === 3 || (t.write && i % 5 === 1);
      calls.push({ time: new Date(now - i * 17 * 60000 - (i % 4) * 9000), tool: t, client: clients[i % 3], ms: 30 + (i * 37) % 420,
        ok: !bad, args: t.args, res: bad ? errors[i % 3] : t.res, token: 'mcp_••••••••k3Fz' });
    }
    var state = { page: 0, size: 10, q: '', tool: '', result: '' };
    function fmt(d) { return d.toISOString().slice(0, 19).replace('T', ' '); }
    function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
    function filtered() {
      var q = state.q.toLowerCase();
      return calls.filter(function (c) {
        return (!q || (c.args + c.client).toLowerCase().indexOf(q) !== -1) && (!state.tool || c.tool.name === state.tool) &&
          (!state.result || (state.result === 'ok') === c.ok);
      });
    }
    function render() {
      var list = filtered(), pages = Math.max(1, Math.ceil(list.length / state.size));
      state.page = Math.min(state.page, pages - 1);
      var from = state.page * state.size, slice = list.slice(from, from + state.size);
      $('rows').innerHTML = slice.map(function (c) {
        return '<tr class="row-link" data-i="' + calls.indexOf(c) + '"><td class="text-nowrap">' + fmt(c.time) + '</td>' +
          '<td><code>' + c.tool.name + '</code>' + (c.tool.write ? ' <span class="badge bg-warning text-dark">write</span>' : '') + '</td>' +
          '<td class="args text-truncate"><code class="small">' + esc(c.args) + '</code></td><td>' + c.client + '</td>' +
          '<td class="text-end">' + c.ms + ' ms</td><td><span class="badge ' + (c.ok ? 'bg-success' : 'bg-danger') + '">' + (c.ok ? 'OK' : 'Error') + '</span></td></tr>';
      }).join('');
      $('empty').hidden = list.length !== 0;
      $('range').textContent = list.length ? (from + 1) + '-' + (from + slice.length) + ' of ' + list.length : '0 results';
      var nav = '';
      for (var p = 0; p < pages; p++) nav += '<li class="page-item' + (p === state.page ? ' active' : '') + '"><a class="page-link" href="#" data-p="' + p + '">' + (p + 1) + '</a></li>';
      $('pageNav').innerHTML = nav;
      $('statCalls').textContent = calls.filter(function (c) { return c.time.toISOString().slice(0, 10) === '2026-10-29'; }).length;
      $('statErrors').textContent = calls.filter(function (c) { return !c.ok && c.time.toISOString().slice(0, 10) === '2026-10-29'; }).length;
      $('statWrites').textContent = calls.filter(function (c) { return c.ok && c.tool.write && c.time.toISOString().slice(0, 10) === '2026-10-29'; }).length;
    }
    $('search').addEventListener('input', function () { state.q = this.value; state.page = 0; render(); });
    $('toolFilter').addEventListener('change', function () { state.tool = this.value; state.page = 0; render(); });
    $('resultFilter').addEventListener('change', function () { state.result = this.value; state.page = 0; render(); });
    $('pageSize').addEventListener('change', function () { state.size = Number(this.value); state.page = 0; render(); });
    $('pageNav').addEventListener('click', function (e) { var a = e.target.closest('[data-p]'); if (!a) return; e.preventDefault(); state.page = Number(a.getAttribute('data-p')); render(); });
    $('rows').addEventListener('click', function (e) {
      var tr = e.target.closest('tr[data-i]'); if (!tr) return;
      var c = calls[Number(tr.getAttribute('data-i'))];
      $('dTitle').textContent = c.tool.name;
      $('dBadge').className = 'badge me-2 ' + (c.ok ? 'bg-success' : 'bg-danger'); $('dBadge').textContent = c.ok ? 'OK' : 'Error';
      $('dTime').textContent = fmt(c.time); $('dClient').textContent = c.client; $('dToken').textContent = c.token; $('dDuration').textContent = c.ms + ' ms';
      $('dReq').textContent = JSON.stringify(JSON.parse(c.args), null, 2); $('dRes').textContent = JSON.stringify(JSON.parse(c.res.replace('…', '"…"')), null, 2);
      bootstrap.Offcanvas.getOrCreateInstance($('detailsPanel')).show();
    });
    render();
  })();
</script>
