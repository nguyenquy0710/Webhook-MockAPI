<!--title: Register-->
<!-- Nguồn: templates/register.html. Lỗi validate hiển thị bằng invalid-feedback như bản gốc -->
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow border-0 rounded-4 mt-5">
      <div class="card-header bg-white border-0 text-center py-4">
        <h3 class="text-dark fw-light mb-0">Create Account</h3>
        <p class="text-muted mt-2 mb-0">Join the Mock Webhook platform</p>
      </div>
      <div class="card-body px-4 pb-4">
        <div class="alert alert-danger d-flex align-items-center" id="regError" hidden>
          <i class="fas fa-exclamation-triangle me-2"></i><div id="regErrorText">Error message</div>
        </div>
        <form id="regForm">
          <div class="form-floating mb-3">
            <input class="form-control form-control-lg" id="username" type="text" placeholder="Username" required>
            <label for="username"><i class="fas fa-user me-2"></i>Username</label>
            <small class="form-text text-muted mt-1">Your webhook API URL will be: <code>https://domain/api/@username</code></small>
          </div>
          <div class="form-floating mb-3">
            <input class="form-control form-control-lg" id="email" type="email" placeholder="name@example.com" required>
            <label for="email"><i class="fas fa-envelope me-2"></i>Email address</label>
          </div>
          <div class="form-floating mb-3">
            <input class="form-control form-control-lg" id="password" type="password" placeholder="Password" required>
            <label for="password"><i class="fas fa-lock me-2"></i>Password</label>
          </div>
          <div class="form-floating mb-4">
            <input class="form-control form-control-lg" id="confirmPassword" type="password" placeholder="Confirm Password" required>
            <label for="confirmPassword"><i class="fas fa-lock me-2"></i>Confirm Password</label>
          </div>
          <div class="d-grid mb-3">
            <button class="btn btn-primary btn-lg" type="submit" data-proto="skip" id="createAccount"><i class="fas fa-user-plus me-2"></i>Create Account</button>
          </div>
          <div class="text-center">
            <p class="mb-0">Already have an account? <a href="login.dc.html" class="text-decoration-none fw-bold">Sign In</a></p>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
<script>
  // Mô phỏng kiểm tra phía server: thiếu trường / mật khẩu ngắn / không khớp thì báo lỗi, hợp lệ thì sang login
  document.getElementById('createAccount').addEventListener('click', function () {
    var v = function (id) { return document.getElementById(id).value; };
    var msg = '';
    if (!v('username').trim() || !v('email').trim() || !v('password')) msg = 'Please fill in all required fields.';
    else if (v('password').length < 6) msg = 'Password must be at least 6 characters.';
    else if (v('password') !== v('confirmPassword')) msg = 'Passwords do not match.';
    document.getElementById('regErrorText').textContent = msg;
    document.getElementById('regError').hidden = !msg;
    if (!msg) location.href = 'login.dc.html';
  });
</script>
